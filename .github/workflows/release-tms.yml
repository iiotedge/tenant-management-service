name: CI/CD • TMS

# Two jobs: build the jar with a real Maven build (installing the one
# `common` module this service actually needs first), then package that
# already-built jar into the plain, distroless Dockerfile - the same
# pre-built-jar pattern every other working service on this platform
# uses. Previously did an in-container Maven build via Dockerfile.workflow,
# which can never work for this service: it only has access to this
# repo's own files (COPY . .), but tenant-management-service depends on
# com.iotmining.common:data, which only exists as source in the separate
# `common` repo (never published as a package) - there was no way for an
# isolated, single-repo Docker build to see it. That's genuinely
# unrelated to credentials/secrets - fixed those first (see this file's
# git history) and still hit this as the real, remaining blocker.
#
# REQUIRES the org-level secret PLATFORM_REPO_TOKEN (a classic PAT - fine-
# grained PATs don't support the GitHub Packages Maven registry) with
# read:packages on iiotedge/platform-build. (GITHUB_TOKEN, provided
# automatically, is used for GHCR push.)
#
# Known remaining blocker, independent of anything in this file:
# com.iiotedge:iiotedge-security-starter:1.0.0 isn't published anywhere
# (checked both GitHub Packages and Maven Central) - this workflow will
# still fail at the "Build & verify" step until that's published.

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/release-tms.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/release-tms.yml'
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/iiotedge/tenant-management-service
  JAVA_VERSION: '21'

concurrency:
  group: tms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # common/data's own <parent> is already the real, published
      # iiotedge-parent (not a local relativePath), so - unlike some
      # other services on this platform - no sibling checkout of the
      # iiotedge/iiotedge repo is needed here, just these two modules.
      #
      # com.iiotedge:iiotedge-security-starter:1.0.0 was never actually a
      # separately-published GitHub Packages artifact - it's this exact
      # module (common/security has that same groupId/artifactId/version
      # verbatim in its own pom.xml, and a <distributionManagement> that's
      # never actually been used to `mvn deploy` it there yet). It just
      # needs the same build-from-source treatment as data - confirmed via
      # a real CI run that got past data cleanly and isolated this as the
      # one remaining unresolved dependency.
      - name: "Checkout common (only 'data' and 'security' are actually needed)"
        uses: actions/checkout@v4
        with:
          repository: iiotedge/common
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: common

      - name: Checkout tenant-management-service
        uses: actions/checkout@v4
        with:
          path: tenant-management-service

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Write GitHub Packages settings.xml
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          SETTINGS="$RUNNER_TEMP/gpr-settings.xml"
          cat > "$SETTINGS" <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          echo "GPR_SETTINGS=$SETTINGS" >> "$GITHUB_ENV"

      - name: Install shared modules (common/data, common/security)
        run: |
          mvn -B -s "$GPR_SETTINGS" -f common/data/pom.xml install -DskipTests
          mvn -B -s "$GPR_SETTINGS" -f common/security/pom.xml install -DskipTests

      - name: Build & verify tenant-management-service
        run: mvn -B -s "$GPR_SETTINGS" -f tenant-management-service/pom.xml clean package -DskipTests

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: tenant-management-service-jar
          path: tenant-management-service/target/tenant-management-service.jar
          retention-days: 7

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout tenant-management-service (Dockerfile only - jar comes from the test job)
        uses: actions/checkout@v4

      - name: Record build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: tenant-management-service-jar
          path: target

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
          cache-from: type=gha,scope=tms
          cache-to: type=gha,mode=max,scope=tms

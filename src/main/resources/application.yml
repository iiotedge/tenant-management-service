# ==========================================
# 1. COMMON CONFIGURATION (Global)
# ==========================================
server:
  port: ${SERVER_PORT:8083} # Script uses 8083 for TMS (check services.csv)

spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: tenant-management-service

  # Set 'dev' as default
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Common JPA Settings
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    database: postgresql

  flyway:
    enabled: false # Keep disabled as per your snippet

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://admin:8506@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    prometheus:
      access: unrestricted

# Service References
services:
  dms:
    url: ${SERVICES_DEVICE_SERVICE_URL:http://localhost:8055}

# Same signing key/env-var as auth-service - required by iiotedge-security-starter's
# StatelessJwtFilter to validate tokens auth-service issues. No fallback here
# on purpose: a default in this shared base file would silently apply to
# prod too if the env var were ever left unset there, letting prod validate
# tokens against a publicly-visible dev key. Dev/hProd carry their own
# convenience fallback; prod has none (see application-{dev,hProd,prod}.yml).
jwt:
  secret: ${JWT_SECRET_KEY_BASE64}

